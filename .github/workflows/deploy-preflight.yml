name: One-shot Deployment Preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-preflight.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
      FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
      FTP_SCHEME: ${{ vars.LOLIPOP_FTP_SCHEME }}
      FTP_PORT: ${{ vars.LOLIPOP_FTP_PORT }}
      BITFRAME_DEPLOY_DIR: ${{ vars.BITFRAME_DEPLOY_DIR }}
      BITFRAME_SITE_URL: ${{ vars.BITFRAME_SITE_URL }}
    steps:
      - name: Report configuration presence only
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local name="$1" value="$2"
            if [[ -n "$value" ]]; then echo "$name=SET"; else echo "$name=MISSING"; fi
          }
          check LOLIPOP_FTP_HOST "$FTP_HOST"
          check LOLIPOP_FTP_USER "$FTP_USER"
          check LOLIPOP_FTP_PASSWORD "$FTP_PASSWORD"
          check LOLIPOP_FTP_SCHEME "$FTP_SCHEME"
          check LOLIPOP_FTP_PORT "$FTP_PORT"
          check BITFRAME_DEPLOY_DIR "$BITFRAME_DEPLOY_DIR"
          check BITFRAME_SITE_URL "$BITFRAME_SITE_URL"
