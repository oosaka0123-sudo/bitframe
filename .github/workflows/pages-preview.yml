name: Deploy Preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare preview artifact
        shell: bash
        run: |
          mkdir -p _site
          cp index.html works.html service.html flow-price.html contact.html _site/
          cp -R assets _site/
          python - <<'PY'
          from pathlib import Path
          tag = '<meta name="robots" content="noindex,nofollow">'
          for p in Path('_site').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              p.write_text(s.replace('</head>', tag + '</head>'), encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
